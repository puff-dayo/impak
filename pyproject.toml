[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impak"
version = "1.0.0"
description = "Space-efficient patch-based image collection format"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
encoder = ["numpy>=1.24"]
cli = ["click>=8.0"]
dev = ["pdoc>=16", "twine>=6", "build>=1", "tqdm>=4"]
all = ["impak[encoder,cli,dev]"]

[project.scripts]
impak = "impak.cli:cli"

[project.urls]
Homepage = "https://puff-dayo.github.io/impak/impak.html"
Repository = "https://github.com/puff-dayo/impak"

[tool.setuptools.packages.find]
where = ["src"]